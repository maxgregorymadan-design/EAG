<script>
const SUPABASE_URL="https://elioleewmeibmbcqphzy.supabase.co";
const SUPABASE_KEY="sb_publishable_pdjfuWxZi8gEERJyLjkIlQ_37zmoGd7";
const FIXED_KEY="EAG-Purple-Cipher-2026";
const ITERATIONS=600000;
const SALT_LENGTH=16;
const IV_LENGTH=12;

const supabaseClient=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function configured(){
    return !SUPABASE_URL.includes("PASTE_")&&!SUPABASE_KEY.includes("PASTE_");
}

function showMessage(text,error=false){
    const box=document.getElementById("message");
    box.textContent=text;
    box.style.color=error?"#ff8fa3":"#b99acb";
}

function bytesToBase64(bytes){
    let binary="";
    for(const byte of bytes) binary+=String.fromCharCode(byte);
    return btoa(binary);
}

function base64ToBytes(base64){
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return bytes;
}

async function deriveKey(password,salt){
    const encoder=new TextEncoder();
    const passwordKey=await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt,
            iterations:ITERATIONS,
            hash:"SHA-256"
        },
        passwordKey,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        ["encrypt","decrypt"]
    );
}

async function encrypt(){
    const input=document.getElementById("input").value;

    if(!input){
        showMessage("Enter something to encrypt.",true);
        return;
    }

    if(!configured()){
        showMessage("Add your Supabase URL and publishable key first.",true);
        return;
    }

    try{
        showMessage("Encrypting and saving...");

        const encoder=new TextEncoder();
        const salt=crypto.getRandomValues(new Uint8Array(SALT_LENGTH));
        const iv=crypto.getRandomValues(new Uint8Array(IV_LENGTH));
        const key=await deriveKey(FIXED_KEY,salt);

        const encrypted=await crypto.subtle.encrypt(
            {name:"AES-GCM",iv,tagLength:128},
            key,
            encoder.encode(input)
        );

        const ciphertext=new Uint8Array(encrypted);
        const header=encoder.encode("EAG1");
        const result=new Uint8Array(
            header.length+
            salt.length+
            iv.length+
            ciphertext.length
        );

        let offset=0;
        result.set(header,offset);
        offset+=header.length;
        result.set(salt,offset);
        offset+=salt.length;
        result.set(iv,offset);
        offset+=iv.length;
        result.set(ciphertext,offset);

        const encryptedText="EAG1."+bytesToBase64(result);

        document.getElementById("output").value=encryptedText;

        const {data,error}=await supabaseClient
            .from("eag_messages")
            .insert({ciphertext:encryptedText})
            .select("id")
            .single();

        if(error) throw error;

        showMessage("Saved successfully.");
    }catch(error){
        console.error(error);
        showMessage("Encryption worked, but cloud save failed: "+error.message,true);
    }
}

async function decrypt(){
    const input=document.getElementById("input").value.trim();

    if(!input){
        showMessage("Enter encrypted EAG data.",true);
        return;
    }

    try{
        showMessage("Decrypting...");

        if(!input.startsWith("EAG1.")) throw new Error("Invalid EAG format");

        const data=base64ToBytes(input.slice(5));
        const header=new TextDecoder().decode(data.slice(0,4));

        if(header!=="EAG1") throw new Error("Invalid header");

        const salt=data.slice(4,4+SALT_LENGTH);
        const iv=data.slice(4+SALT_LENGTH,4+SALT_LENGTH+IV_LENGTH);
        const ciphertext=data.slice(4+SALT_LENGTH+IV_LENGTH);

        const key=await deriveKey(FIXED_KEY,salt);

        const decrypted=await crypto.subtle.decrypt(
            {name:"AES-GCM",iv,tagLength:128},
            key,
            ciphertext
        );

        document.getElementById("output").value=
            new TextDecoder().decode(decrypted);

        showMessage("Decryption complete.");
    }catch(error){
        console.error(error);
        document.getElementById("output").value="";
        showMessage("Decryption failed — invalid data.",true);
    }
}
